name: Sonde de reconnaissance

# Lancée à la main. Sert à découvrir, depuis une machine qui a réellement
# accès à Internet, quels sites d'annonces sont exploitables et sous quelle
# forme — plutôt que de deviner les URL et les sélecteurs.
on:
  workflow_dispatch:
    inputs:
      tout:
        description: 'Rejouer aussi les sondes larges (quels sites répondent)'
        type: boolean
        default: false

jobs:
  sonde:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: scraper/package-lock.json
      - working-directory: scraper
        run: npm ci
      - working-directory: scraper
        run: npx playwright install --with-deps chromium
      - name: Sonde des moteurs de recherche
        working-directory: scraper
        run: npm run probe:search

      - name: Sonde large — quels sites répondent
        if: always() && inputs.tout
        working-directory: scraper
        run: npm run probe

      - name: Sonde approfondie — structure des pages de résultats
        if: always() && inputs.tout
        working-directory: scraper
        run: npm run probe:deep
